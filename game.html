<html>
<head>
    <title>Kingdom's Last Stand</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #shop { display: none; }
        .enemy { position: absolute; width: 50px; height: 50px; background-color: red; }
        .castle { position: absolute; width: 100px; height: 100px; background-color: blue; bottom: 0; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>
    <h1>Kingdom's Last Stand</h1>
    <div id="castle" class="castle"></div>
    <div id="shop">
        <h2>Shop</h2>
        <button onclick="buyUpgrade()">Buy Upgrade</button>
    </div>
    <script>
        let wave = 0;
        let enemies = [];
        let enemyHP = 100;
        let castleHealth = 1000;

        function startGame() {
            wave = 0;
            newWave();
        }

        function newWave() {
            wave++;
            enemyHP += 20 * wave;
            spawnEnemies(wave);
        }

        function spawnEnemies(wave) {
            for (let i = 0; i < wave; i++) {
                let enemy = document.createElement('div');
                enemy.className = 'enemy';
                enemy.style.top = '0px';
                enemy.style.left = Math.random() * window.innerWidth + 'px';
                document.body.appendChild(enemy);
                enemies.push(enemy);
                moveEnemy(enemy);
            }
        }

        function moveEnemy(enemy) {
            let posY = 0;
            let interval = setInterval(() => {
                if (posY < window.innerHeight - 100) {
                    posY += 1;
                    enemy.style.top = posY + 'px';
                } else {
                    clearInterval(interval);
                    castleHealth -= enemyHP;
                    checkGameOver();
                    enemy.remove();
                }
            }, 100);
        }

        function checkGameOver() {
            if (castleHealth <= 0) {
                alert('Game Over!');
                clearEnemies();
            }
        }

        function clearEnemies() {
            enemies.forEach(enemy => enemy.remove());
            enemies = [];
        }

        function buyUpgrade() {
            // Implement upgrade logic here
        }

        startGame();
    </script>
</body>
</html>
